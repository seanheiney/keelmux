name: Documentation site
on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "CHANGELOG.md", "SECURITY.md", "SUPPORT.md", "CONTRIBUTING.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "README.md", "CHANGELOG.md", "SECURITY.md", "SUPPORT.md", "CONTRIBUTING.md", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate canonical guides and generated navigation
        run: |
          python3 -m unittest discover -s docs/site/tests -v
          node --check docs/site/assets/site.js
          python3 docs/site/build.py --output "$RUNNER_TEMP/keelmux-docs" --base-path /keelmux/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/keelmux-docs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish reviewed generated site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
