name: Release candidate
# Tags prepare an attested DRAFT. The captain reviews evidence and publishes it.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Validate tag and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(git status --porcelain)"
      - name: Source and installer gates
        run: |
          go test -race ./...
          go vet ./...
          python3 tests/installer_test.py
      - name: Four target archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" scripts/build-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/keelmux-assets"
      - name: Actual Linux archive smoke
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/install-smoke.py "$RUNNER_TEMP/keelmux-assets" "$RELEASE_TAG"
      - name: Attest archives and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "${{ runner.temp }}/keelmux-assets/*"
      - name: Prepare draft for captain review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/keelmux-assets/"* --verify-tag --draft --title "Keelmux $RELEASE_TAG" --generate-notes
