name: Paired macOS terminal diagnostic
on:
  push:
    branches: ["codex/macos-paired-throughput-56e8040"]
permissions:
  contents: read
jobs:
  paired:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: diagnostic
      - name: Install unchanged Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: diagnostic/go.sum
      - name: Checkout exact green parent
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 1e429fa8991edc41df8002958b9b439b3dd69ab8
          persist-credentials: false
          path: parent
      - name: Checkout exact retained failing head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 56e80407cd5000f6bbc7dd48fac5b678002447e2
          persist-credentials: false
          path: head
      - name: Run the two original race tests once at each revision
        env:
          GOTOOLCHAIN: local
        run: python3 diagnostic/scripts/diagnostics/macos-paired-throughput.py parent head
